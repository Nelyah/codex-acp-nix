name: Update codex-acp

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: nix
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          nix-shell -p git --run '
            set -euo pipefail
            git clone --depth=1 "${SERVER%%://*}://x-access-token:${TOKEN}@${SERVER#*://}/${REPO}.git" .
          '
      - name: Update
        env:
          NELYAH_BOT_SSH_KEY: ${{ secrets.NELYAH_BOT_SSH_KEY }}
          NIX_CONFIG: "experimental-features = nix-command flakes"
        run: |
          nix-shell -p git openssh --run '
            set -euo pipefail
            umask 077
            printf "%s\n" "$NELYAH_BOT_SSH_KEY" > "$HOME/deploy_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/deploy_key -o StrictHostKeyChecking=accept-new"
            nix run nixpkgs#nix-update -- --flake codex-acp
            git diff --quiet && exit 0
            nix build
            version="$(nix eval --raw .#codex-acp.version)"
            git config user.name "forgejo-actions[bot]"
            git config user.email "forgejo-actions@noreply.local"
            git add flake.nix
            git commit -m "update codex-acp to v$version"
            git remote set-url origin "ssh://git@forgejo-ssh.forgejo.svc.k8s.nelyah.eu/Nelyah/codex-acp-nix.git"
            git push origin HEAD:main
          '
